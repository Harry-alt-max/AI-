<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messenger-like Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<style>
:root {
  --bg-primary: #0f172a;
  --bg-secondary: #0b122b;
  --surface: #111827;
  --surface-2: #0f162b;
  --border: rgba(255,255,255,0.08);
  --text-primary: #e5e7eb;
  --text-secondary: #9ca3af;
  --primary: #3b82f6;
  --primary-600: #2563eb;
  --online: #22c55e;
  --unread: #3b82f6;
  --me-bg: #3b82f6;
  --them-bg: rgba(255,255,255,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Inter, "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: radial-gradient(circle at top, #0f162b, #030712);
  color: var(--text-primary);
  height: 100dvh;
  overflow: hidden;
}
.app {
  display: grid;
  grid-template-columns: 320px 1fr 0fr;
  height: 100dvh;
  transition: grid-template-columns .25s ease;
}
.app.show-info {
  grid-template-columns: 320px 1fr 320px;
}
.sidebar {
  background: linear-gradient(180deg, rgba(15,23,42,0.98), rgba(11,18,43,0.98));
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.sidebar-header {
  padding: 16px 18px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.user-box {
  display: flex;
  align-items: center;
  gap: 10px;
}
.avatar {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 20%, #4d7cfe, #1e3a8a);
  display: grid; place-items: center;
  font-weight: 700; letter-spacing: .5px;
  position: relative;
}
.avatar.online::after {
  content: '';
  position: absolute; right: -1px; bottom: -1px;
  width: 11px; height: 11px; border-radius: 50%;
  background: var(--online);
  border: 2px solid var(--surface);
}
.avatar.small { width: 34px; height: 34px; font-size: .95rem; }
.avatar.tiny { width: 28px; height: 28px; font-size: .85rem; }
.search-wrap {
  padding: 0 14px 10px;
}
.search {
  width: 100%;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  color: var(--text-primary);
  border-radius: 999px;
  padding: 8px 12px 8px 36px;
  outline: none;
}
.search::placeholder { color: var(--text-secondary); }
.search-box { position: relative; }
.search-box i {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--text-secondary);
}
.actions { display: flex; gap: 6px; }
.btn-ghost {
  background: transparent; border: 1px solid transparent;
  color: var(--text-primary); padding: 6px 8px;
  border-radius: 10px; cursor: pointer;
}
.btn-ghost:hover { background: rgba(255,255,255,0.08); }
.conversations {
  flex: 1; overflow: auto; padding: 4px 8px 8px;
  display: flex; flex-direction: column; gap: 4px;
}
.conv {
  display: grid; grid-template-columns: auto 1fr auto;
  align-items: center; gap: 10px;
  padding: 8px 8px; border-radius: 12px; cursor: pointer;
  position: relative;
}
.conv:hover { background: rgba(255,255,255,0.06); }
.conv.active { background: rgba(59,130,246,0.22); }
.conv-info { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.conv-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-last { color: var(--text-secondary); font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.conv-time { color: var(--text-secondary); font-size: .85rem; }
.unread-badge {
  min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 999px; background: var(--unread);
  display: grid; place-items: center; font-size: .8rem; font-weight: 700;
}
.chat {
  background: radial-gradient(circle at 50% 0%, rgba(17,24,39,0.98), rgba(3,7,18,0.98));
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; min-height: 0;
}
.chat-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 18px; border-bottom: 1px solid var(--border);
  background: rgba(15,23,42,0.8); backdrop-filter: blur(8px);
}
.chat-header-left { display: flex; align-items: center; gap: 12px; }
.chat-title { display: flex; flex-direction: column; gap: 2px; }
.chat-name { font-weight: 700; }
.chat-status { color: var(--text-secondary); font-size: .92rem; }
.header-actions { display: flex; gap: 6px; }
.messages {
  flex: 1; overflow: auto; padding: clamp(14px,2vw,24px);
  display: flex; flex-direction: column; gap: 10px;
  scroll-behavior: smooth;
}
.day-sep {
  align-self: center; color: var(--text-secondary);
  background: rgba(255,255,255,0.08); padding: 2px 8px; border-radius: 999px;
  font-size: .88rem; margin: 6px 0;
}
.msg {
  display: flex; align-items: flex-end; gap: 8px; max-width: 78%;
}
.msg.them { align-self: flex-start; }
.msg.me { align-self: flex-end; flex-direction: row-reverse; }
.bubble {
  padding: 8px 12px; border-radius: 18px;
  display: flex; flex-direction: column; gap: 4px; word-break: break-word; white-space: pre-wrap;
  box-shadow: 0 1px 0 rgba(255,255,255,0.08) inset;
}
.msg.them .bubble { background: var(--them-bg); border-bottom-left-radius: 8px; }
.msg.me .bubble { background: var(--me-bg); border-bottom-right-radius: 8px; color: #fff; }
.msg-meta { display: flex; align-items: center; gap: 6px; justify-content: flex-end; opacity: .85; }
.msg-time { font-size: .82rem; }
.msg-tail { width: 8px; }
.attach { display: flex; flex-direction: column; gap: 6px; }
.attach img { max-width: 260px; max-height: 220px; border-radius: 12px; }
.attach a { color: inherit; text-decoration: none; }
.attach a:hover { text-decoration: underline; }
.typing {
  align-self: flex-start; color: var(--text-secondary);
  background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 999px;
  font-size: .92rem; animation: pulse 1.2s ease-in-out infinite alternate;
}
@keyframes pulse { from { opacity: .5; } to { opacity: 1; } }
.composer {
  border-top: 1px solid var(--border);
  padding: 8px 10px; display: flex; align-items: flex-end; gap: 8px;
  background: rgba(15,23,42,0.92); backdrop-filter: blur(8px);
}
.composer-tools { display: flex; gap: 4px; }
.input-wrap { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.textarea {
  width: 100%; resize: none; max-height: 120px; min-height: 42px;
  background: rgba(255,255,255,0.08); border: 1px solid var(--border);
  color: var(--text-primary); border-radius: 18px; padding: 9px 14px;
  outline: none; line-height: 1.5;
}
.textarea::placeholder { color: var(--text-secondary); }
.preview-bar {
  display: flex; flex-wrap: wrap; gap: 6px; padding: 0 4px;
}
.preview-chip {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.1); border: 1px solid var(--border);
  padding: 4px 8px; border-radius: 999px; font-size: .92rem;
}
.send-btn {
  background: var(--primary); border: none; color: #fff;
  width: 42px; height: 42px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer;
}
.send-btn:hover { background: var(--primary-600); }
.info-panel {
  background: linear-gradient(180deg, rgba(15,23,42,0.98), rgba(11,18,43,0.98));
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column; min-height: 0; overflow: auto;
}
.info-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 1px solid var(--border);
}
.info-content { padding: 16px; display: flex; flex-direction: column; gap: 18px; }
.profile-card { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.avatar.big { width: 72px; height: 72px; font-size: 1.6rem; }
.section { display: flex; flex-direction: column; gap: 8px; }
.section-title { color: var(--text-secondary); font-size: .95rem; }
.option { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 10px; }
.option:hover { background: rgba(255,255,255,0.06); }
@media (max-width: 980px) {
  .app { grid-template-columns: 300px 1fr 0fr; }
  .app.show-info { grid-template-columns: 300px 1fr 280px; }
}
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: absolute; inset: 0 40% 0 0; transform: translateX(-100%); transition: transform .25s ease; z-index: 10; }
  .app.show-sidebar .sidebar { transform: translateX(0); }
  .app.show-info { grid-template-columns: 1fr; }
  .info-panel { position: absolute; inset: 0 0 0 40%; transform: translateX(100%); transition: transform .25s ease; z-index: 10; }
  .app.show-info .info-panel { transform: translateX(0); }
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,.4); z-index: 5; display: none; }
  .app.show-sidebar .overlay, .app.show-info .overlay { display: block; }
}
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="user-box">
        <div class="avatar online" id="meAvatar">我</div>
        <div>
          <div style="font-weight:600">聊天</div>
          <div style="color:var(--text-secondary);font-size:.92rem">線上</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn-ghost" id="btnNewChat"><i class="fa-solid fa-pen-to-square"></i></button>
        <button class="btn-ghost" id="btnToggleSidebar" class="hidden"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
    <div class="search-wrap">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input class="search" id="search" placeholder="搜尋聯絡人或訊息">
      </div>
    </div>
    <div class="conversations" id="conversations"></div>
  </aside>
  <main class="chat">
    <header class="chat-header">
      <div class="chat-header-left">
        <button class="btn-ghost hidden" id="btnBack"><i class="fa-solid fa-arrow-left"></i></button>
        <div class="avatar small online" id="peerAvatar">A</div>
        <div class="chat-title">
          <div class="chat-name" id="peerName">Alice</div>
          <div class="chat-status" id="peerStatus">正在輸入...</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-ghost"><i class="fa-solid fa-phone"></i></button>
        <button class="btn-ghost"><i class="fa-solid fa-video"></i></button>
        <button class="btn-ghost" id="btnInfo"><i class="fa-solid fa-circle-info"></i></button>
      </div>
    </header>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <div class="composer-tools">
        <button class="btn-ghost" id="btnEmoji"><i class="fa-regular fa-face-smile"></i></button>
        <button class="btn-ghost" id="btnImg"><i class="fa-regular fa-image"></i></button>
        <button class="btn-ghost" id="btnFile"><i class="fa-solid fa-paperclip"></i></button>
      </div>
      <div class="input-wrap">
        <textarea class="textarea" id="input" rows="1" placeholder="輸入訊息..."></textarea>
        <div class="preview-bar" id="previewBar"></div>
      </div>
      <button class="send-btn" id="btnSend"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
    <input type="file" id="fileInput" accept="image/*" class="hidden">
    <input type="file" id="fileInputAny" class="hidden">
  </main>
  <aside class="info-panel">
    <div class="info-header">
      <strong>詳細資料</strong>
      <button class="btn-ghost" id="btnCloseInfo"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="info-content">
      <div class="profile-card">
        <div class="avatar big online" id="peerAvatarBig">A</div>
        <div class="chat-name" id="peerNameBig">Alice</div>
        <div style="color:var(--text-secondary)">線上</div>
      </div>
      <div class="section">
        <div class="section-title">聊天設定</div>
        <div class="option"><div>靜音通知</div><input type="checkbox"></div>
        <div class="option"><div>搜尋聊天記錄</div><i class="fa-solid fa-chevron-right"></i></div>
      </div>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>
</div>
<script>
const $ = s=>document.querySelector(s);
const $$ = s=>[...document.querySelectorAll(s)];
const LS_KEY = 'messenger_v1';
const app = $('#app');
const convList = $('#conversations');
const messagesEl = $('#messages');
const input = $('#input');
const btnSend = $('#btnSend');
const btnImg = $('#btnImg');
const btnFile = $('#btnFile');
const fileInput = $('#fileInput');
const fileInputAny = $('#fileInputAny');
const previewBar = $('#previewBar');
const peerNameEl = $('#peerName'), peerStatusEl = $('#peerStatus'), peerAvatarEl = $('#peerAvatar');
const peerNameBig = $('#peerNameBig'), peerAvatarBig = $('#peerAvatarBig');
const btnInfo = $('#btnInfo'), btnCloseInfo = $('#btnCloseInfo');
const btnBack = $('#btnBack'), btnNewChat = $('#btnNewChat');
const overlay = $('#overlay'), search = $('#search');

function uid(){ return Math.random().toString(36).slice(2,9); }
function now(){ return Date.now(); }
function timeStr(ts){
  const d=new Date(ts), h=d.getHours().toString().padStart(2,'0'), m=d.getMinutes().toString().padStart(2,'0');
  return h+':'+m;
}
function dayStr(ts){
  const d=new Date(ts); return d.toLocaleDateString('zh-TW');
}
function initials(name){ return name.slice(0,1).toUpperCase(); }
function load(){ try{return JSON.parse(localStorage.getItem(LS_KEY))||null;}catch(e){return null;} }
function save(s){ localStorage.setItem(LS_KEY, JSON.stringify(s)); }

const defaultState = {
  me: {id:'me', name:'我'},
  current: 'c1',
  convs: [
    {id:'c1', peer:{id:'alice', name:'Alice', online:true}, last:'嗨！', lastTs:now()-60000*5, unread:0},
    {id:'c2', peer:{id:'bob', name:'Bob', online:false}, last:'好', lastTs:now()-60000*60, unread:1},
    {id:'c3', peer:{id:'carol', name:'Carol', online:true}, last:'收到', lastTs:now()-60000*120, unread:0},
  ],
  msgs: {
    c1: [{id:uid(), from:'alice', text:'嗨！', ts:now()-60000*5, type:'text'}],
    c2: [{id:uid(), from:'bob', text:'好', ts:now()-60000*60, type:'text'}],
    c3: [{id:uid(), from:'carol', text:'收到', ts:now()-60000*120, type:'text'}],
  },
  typing:{},
  pending: []
};

let state = load() || defaultState;
if(!state.msgs) state.msgs={}; if(!state.convs) state.convs=[]; if(!state.typing) state.typing={};

function ensureConvMsgs(id){ if(!state.msgs[id]) state.msgs[id]=[]; }
state.convs.forEach(c=>ensureConvMsgs(c.id));
if(!state.convs.find(c=>c.id===state.current)) state.current = state.convs[0]?.id||'c1';

let replyTimers=[];
function clearTimers(){ replyTimers.forEach(t=>clearTimeout(t)); replyTimers=[]; }

function renderConvs(){
  const q = search.value.trim().toLowerCase();
  convList.innerHTML = '';
  state.convs.filter(c=>{
    if(!q) return true;
    return c.peer.name.toLowerCase().includes(q) || (c.last||'').toLowerCase().includes(q);
  }).sort((a,b)=>b.lastTs-a.lastTs).forEach(c=>{
    const div=document.createElement('div'); div.className='conv'+(c.id===state.current?' active':'');
    const last = c.last || (state.msgs[c.id]?.at(-1)?.text?.slice(0,20) || '');
    div.innerHTML = `
      <div class="avatar small ${c.peer.online?'online':''}">${initials(c.peer.name)}</div>
      <div class="conv-info">
        <div class="conv-name">${c.peer.name}</div>
        <div class="conv-last">${last}</div>
      </div>
      <div class="conv-meta">
        <div class="conv-time">${c.lastTs?timeStr(c.lastTs):''}</div>
        ${c.unread?'<div class="unread-badge">'+c.unread+'</div>':''}
      </div>`;
    div.onclick=()=>{ setCurrent(c.id); closeMobile(); };
    convList.appendChild(div);
  });
}
function setCurrent(id){
  state.current=id; const c=getConv(id); if(c){ c.unread=0; }
  renderConvs(); renderChat(); save(state);
}
function getConv(id){ return state.convs.find(x=>x.id===id); }
function getPeer(c){ return c?.peer||{name:'',online:false}; }

function renderChat(){
  const c=getConv(state.current); if(!c){ return; }
  const peer=getPeer(c);
  peerNameEl.textContent=peer.name; peerNameBig.textContent=peer.name;
  peerAvatarEl.textContent=initials(peer.name); peerAvatarBig.textContent=initials(peer.name);
  peerAvatarEl.classList.toggle('online',!!peer.online); peerAvatarBig.classList.toggle('online',!!peer.online);
  peerStatusEl.textContent = state.typing[state.current] ? '正在輸入...' : (peer.online?'線上':'離線');
  messagesEl.innerHTML='';
  const list = state.msgs[state.current]||[];
  let lastDay='';
  list.forEach(m=>{
    const d=dayStr(m.ts); if(d!==lastDay){ const sep=document.createElement('div'); sep.className='day-sep'; sep.textContent=d; messagesEl.appendChild(sep); lastDay=d; }
    const wrap=document.createElement('div'); wrap.className='msg '+(m.from==='me'?'me':'them');
    let attach='';
    if(m.file){
      const f=m.file;
      if(f.type&&f.type.startsWith('image/')){
        attach=`<div class="attach"><img src="data:${f.type};base64,${f.data}"></div>`;
      }else{
        attach=`<div class="attach"><a download="${esc(f.name)}" href="data:${f.type||'application/octet-stream'};base64,${f.data}">📎 ${esc(f.name)}</a></div>`;
      }
    }
    wrap.innerHTML = `
      ${m.from!=='me'?'<div class="avatar tiny">'+initials(peer.name)+'</div>':''}
      <div class="bubble">
        ${m.text?'<div>'+esc(m.text)+'</div>':''}
        ${attach}
        <div class="msg-meta"><span class="msg-time">${timeStr(m.ts)}</span></div>
      </div>`;
    messagesEl.appendChild(wrap);
  });
  if(state.typing[state.current]){
    const t=document.createElement('div'); t.className='typing'; t.textContent='對方正在輸入...'; messagesEl.appendChild(t);
  }
  requestAnimationFrame(()=>{ messagesEl.scrollTop = messagesEl.scrollHeight; });
}
function esc(s=''){ return s.replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[c])); }
// 自動回覆功能
function scheduleAutoReply(convId){
  const c=getConv(convId); if(!c) return;
  state.typing[convId]=true; renderChat(); save(state);
  const t=setTimeout(()=>{
    state.typing[convId]=false;
    const replies=['了解','好的','收到','OK','沒問題','謝謝','好啊','嗯嗯','好的，馬上處理'];
    const text=replies[Math.floor(Math.random()*replies.length)];
    const m={id:uid(), from:c.peer.id, ts:now(), type:'text', text};
    ensureConvMsgs(convId); state.msgs[convId].push(m);
    c.last=text; c.lastTs=m.ts;
    if(convId!==state.current){ c.unread=(c.unread||0)+1; }
    renderConvs(); renderChat(); save(state);
  }, 800+Math.random()*1500);
  replyTimers.push(t);
}
function simulateReply(convId){ scheduleAutoReply(convId); }

function updateLastFromText(text){
  const id=state.current, c=getConv(id); if(!c) return;
  if(text){ c.last = text; c.lastTs = now(); } else { c.lastTs = c.lastTs||now(); }
  c.unread=0; renderConvs(); save(state);
}
function updateLastFromMsg(file,text){
  const id=state.current, c=getConv(id); if(!c) return;
  c.last = text || (file?`傳送了 ${file.name}`:''); c.lastTs = now(); c.unread=0; renderConvs(); save(state);
}
function sendMsg({text='',file=null}){
  const id=state.current, c=getConv(id); if(!id) return;
  const m={id:uid(), from:'me', ts:now(), type:file?'file':(text?'text':''), text, file};
  ensureConvMsgs(id); state.msgs[id].push(m);
  // last 已在呼叫端更新
  renderChat(); save(state);
  // 自動回覆
  simulateReply(id);
}
function simulateReply(convId){
  const c=getConv(convId); if(!c) return;
  const peerName=c.peer.name;
  state.typing[convId]=true; renderChat(); save(state);
  const delay = 800 + Math.random()*1800;
  const t1=setTimeout(()=>{
    state.typing[convId]=false;
    const replies = ['了解', '好的', '收到', 'OK', '沒問題', '謝謝', '好啊', '嗯嗯'];
    const text = replies[Math.floor(Math.random()*replies.length)];
    const m={id:uid(), from:peerName.toLowerCase(), ts:now(), type:'text', text};
    ensureConvMsgs(convId); state.msgs[convId].push(m);
    c.last=text; c.lastTs=m.ts;
    if(convId!==state.current){ c.unread = (c.unread||0)+1; }
    renderConvs(); renderChat(); save(state);
  }, delay);
  replyTimers.push(t1);
}
function addPreview(file){
  const chip=document.createElement('div'); chip.className='preview-chip';
  const isImg=file.type.startsWith('image/');
  chip.innerHTML = `<span>${file.name}</span><button class="btn-ghost" style="padding:2px 6px"><i class="fa-solid fa-xmark"></i></button>`;
  const btn=chip.querySelector('button'); btn.onclick=()=>{ chip.remove(); chip._file=null; };
  chip._file=file; previewBar.appendChild(chip);
}
async function fileToData(f){
  if(f.size>6*1024*1024){ alert('檔案過大（>6MB），建議小一點。'); return null; }
  const buf=await f.arrayBuffer(); const bytes=new Uint8Array(buf); let bin=''; for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  return {name:f.name, type:f.type||'application/octet-stream', data:btoa(bin)};
}
input.addEventListener('input', ()=>{
  input.style.height='auto'; input.style.height = Math.min(input.scrollHeight,120)+'px';
});
input.addEventListener('keydown', e=>{
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); doSend(); }
});
btnSend.onclick=doSend;
function doSend(){
  const text=input.value.trim();
  const chips=[...previewBar.querySelectorAll('.preview-chip')];
  const files=chips.map(ch=>ch._file).filter(Boolean);
  if(!text && files.length===0) return;
  if(files.length>0){
    files.forEach(f=> fileToData(f).then(fd=>{ if(fd){ sendMsg({file:fd}); updateLastFromMsg(fd,text); } }));
    previewBar.innerHTML='';
  } else if(text){
    sendMsg({text}); updateLastFromText(text);
  } else {
    updateLastFromText(text);
  }
  input.value=''; input.style.height='auto';
}
btnImg.onclick=()=>fileInput.click();
btnFile.onclick=()=>fileInputAny.click();
fileInput.onchange=e=>{ const f=e.target.files[0]; if(f){ addPreview(f); e.target.value=''; } };
fileInputAny.onchange=e=>{ const f=e.target.files[0]; if(f){ addPreview(f); e.target.value=''; } };
btnInfo.onclick=()=>app.classList.toggle('show-info');
btnCloseInfo.onclick=()=>app.classList.remove('show-info');
overlay.onclick=()=>{ app.classList.remove('show-sidebar','show-info'); };
btnBack.onclick=()=>app.classList.add('show-sidebar');
function closeMobile(){ if(window.innerWidth<=820){ app.classList.remove('show-sidebar'); } }
function checkMobile(){
  if(window.innerWidth<=820){ btnBack.classList.remove('hidden'); } else { btnBack.classList.add('hidden'); app.classList.remove('show-sidebar'); }
}
window.addEventListener('resize', checkMobile); checkMobile();
search.oninput=renderConvs;
btnNewChat.onclick=()=>{
  const name = prompt('新增聊天對象名稱：'); if(!name) return;
  const id='c-'+uid(); const c={id, peer:{id:id+'p', name:trim(name), online:Math.random()<.5}, last:'', lastTs:now(), unread:0};
  state.convs.unshift(c); ensureConvMsgs(id); state.current=id; renderConvs(); renderChat(); save(state); closeMobile();
};
function trim(s){ return (s||'').trim()||'新聯絡人'; }
renderConvs(); renderChat();
</script>
